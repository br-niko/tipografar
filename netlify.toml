[build]
  command = "cd prototipo-astro && npm install && npm run build"
  publish = "prototipo-astro/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/admin"
  to = "https://app.pagescms.org/br-niko/tipografar"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://app.pagescms.org/br-niko/tipografar"
  status = 302
  force = true
