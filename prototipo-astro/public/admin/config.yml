backend:
  name: git-gateway
  branch: main

local_backend: true

locale: "pt"

# Onde as imagens enviadas pelo painel serão salvas no repositório
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "projetos"
    label: "Projetos dos Alunos"
    label_singular: "Projeto"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{aluno}} ({{semestre}})"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "projeto" }
      - { label: "Título do Projeto", name: "title", widget: "string", required: true }
      - { label: "Nome do(a) Aluno(a)", name: "aluno", widget: "string", required: true }
      - {
          label: "Semestre (ex: 2025/2)",
          name: "semestre",
          widget: "string",
          pattern: ['^\d{4}/[12]$', "Use o formato AAAA/1 ou AAAA/2 (ex: 2025/2)"],
          required: true
        }
      - {
          label: "Categoria",
          name: "categories",
          widget: "list",
          default: ["design de tipos"],
          hint: "Ex: design de tipos, lettering, experimento de processo"
        }
      - {
          label: "Tags (Palavras-chave para a Nuvem de Tags)",
          name: "tags",
          widget: "list",
          default: [],
          hint: "Separe por vírgula. Ex: caligrafia, pôster, experimental, grafite"
        }
      - {
          label: "Prêmio (opcional)",
          name: "premio",
          widget: "string",
          required: false,
          default: "",
          hint: "Deixe em branco se não houver ou preencha ex: 🏆 Bienal de Design Gráfico"
        }
      - {
          label: "Projeto em Destaque na Home?",
          name: "featured",
          widget: "boolean",
          default: false
        }
      - {
          label: "Imagem de Capa",
          name: "imagem_capa",
          widget: "image",
          required: false,
          default: "/assets/images/placeholder.svg"
        }
      - {
          label: "Conteúdo do Projeto (Texto e Imagens)",
          name: "body",
          widget: "markdown",
          required: true
        }
