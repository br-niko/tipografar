---
layout: default
---
<div class="featured-list-page">
  
  <h1 class="page-title mb-4">{{ page.title }}</h1>

  <div class="row">
    {% for projeto in site.posts %}
      {% if projeto.featured == true %}
        <div class="col-md-4 mb-4">
          <div class="card h-100">
            <div style="height: 200px; background-color: #eee;"></div>
            <div class="card-body">
              <div class="card-meta-badges">
                <span class="category-outline-badge me-2 mb-2">{{ projeto.categories | first }}</span>
                {% if projeto.premio and projeto.premio != "" %}<span class="award-tag me-2 mb-2">{{ projeto.premio }}</span>{% endif %}
              </div>
              <h5 class="card-title"><a href="{{ projeto.url }}" class="text-decoration-none">{{ projeto.title }}</a></h5>
              <p class="card-text"><small>{{ projeto.aluno }}</small></p>
            </div>
          </div>
        </div>
      {% endif %}
    {% endfor %}
  </div>

</div>
