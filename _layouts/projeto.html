---
layout: default
---
<article class="project-page">

  <header class="project-header mb-4">
    <h1 class="page-title">{{ page.title }}</h1>
    <hr class="section-divider">
     <div class="project-meta d-flex align-items-center">
      <a href="/categorias/{{ page.categories | first | slugify }}/" class="category-badge me-2 mb-2">{{ page.categories | first }}</a>
      <a href="/semestres/{{ page.semestre | replace: '/', '-' }}/" class="archive-tag me-2 mb-2">{{ page.semestre }}</a>
      {% if page.premio and page.premio != "" %}
        <span class="award-tag me-2 mb-2">{{ page.premio }}</span>
      {% endif %}
    </div>
    <p class="project-author mt-6">por {{ page.aluno }}</p>
    <hr class="section-divider section-divider--muted">
   
  </header>
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="project-content">
        {{ content }}
      </div>
    </div>
  </div>

</article>
